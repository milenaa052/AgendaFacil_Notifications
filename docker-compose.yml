services:
  service-notifications:
    build: ./notifications-service
    restart: always
    environment:
      DB_HOST: notifications-db
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: notificationsdb
      DB_PORT: 5432
      USERS_API: http://service-users:3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - notifications-db
      - redis-notifications
    networks: [AgendaFacil_Notifications]

  notifications-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notificationsdb
    ports:
      - "5435:5432"
    volumes:
      - notifications_data:/var/lib/postgresql/data
    networks:
      - AgendaFacil_Notifications
    
  redis-notifications:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    networks: [AgendaFacil_Notifications]
  
  nginx-notifications:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - service-notifications
    networks: [AgendaFacil_Notifications]

volumes:
  notifications_data:

networks:
  AgendaFacil_Notifications:
    driver: bridge