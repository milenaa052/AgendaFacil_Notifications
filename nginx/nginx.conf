events {
  worker_connections 1024;
}

http {
  upstream service_notifications {
    server service-notifications:3000;
  }

  server {
    listen 8082;

    location /notifications-customer {
      proxy_pass http://service_notifications/notifications-customer;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /notifications-company {
      proxy_pass http://service_notifications/notifications-company;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}